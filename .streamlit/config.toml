[theme]
# Primary color affects the submit buttons, focus borders on text boxes, and default user chat icon background
primaryColor = "#005a9c"

# Background color for the main content area
backgroundColor = "#ffffff"

# Background color for the sidebar and most interactive widgets
secondaryBackgroundColor = "#f0f2f6"

# Color used for almost all text
textColor = "#31333F"

# Font family for all text in the app
font = "sans serif"
