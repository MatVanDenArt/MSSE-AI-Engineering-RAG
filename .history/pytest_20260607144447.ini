[pytest]
addopts = -v
filterwarnings =
    # Ignore specific deprecation warnings from libraries that are out of our control.
    # This keeps the test output clean and focused on actual test results.

    # Starlette/HTTPX test client warning
    ignore:Using `httpx` with `starlette.testclient` is deprecated:StarletteDeprecationWarning
    # LangChain community sunset warning
    ignore:`langchain-community` is being sunset:DeprecationWarning
    # LangChain Chroma class deprecation
    ignore:The class `Chroma` was deprecated:LangChainDeprecationWarning
    # Low-level Python warning from google-genai dependency
    ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning
    # Low-level Python warning from chromadb/langchain-core dependencies
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning