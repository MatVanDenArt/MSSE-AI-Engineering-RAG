name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run automated tests
      run: |
        # Set dummy env variables to ensure LangChain initializes without crashing
        export GEMINI_API_KEY="dummy_key"
        export GROQ_API_KEY="dummy_key"
        python -m pytest tests/
        
    - name: Trigger Render Deployment
      if: success() && github.ref == 'refs/heads/main'
      run: |
        if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
          echo "Render Deploy Hook URL not set. Skipping deployment."
        else
          echo "Tests passed! Triggering Render deployment..."
          curl -X GET "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        fi
